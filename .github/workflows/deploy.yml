name: Deploy v2

# Single workflow handles both branches using GitHub Environments.
# GitHub automatically picks the right secrets based on which environment is active.
#
# Required GitHub Environments (Settings → Environments):
#   - "dev"        → triggered on push to dev branch
#   - "production" → triggered on push to main branch
#
# Secrets to add to EACH environment (same name, different value):
#   SUPABASE_ACCESS_TOKEN  — Supabase personal access token
#   SUPABASE_DB_PASSWORD   — DB password for this environment's project
#   SUPABASE_PROJECT_ID    — Project ref (e.g. abcdefghijklmnop)
#   VERCEL_TOKEN           — Vercel personal access token
#   VERCEL_ORG_ID          — Vercel team/org ID
#   VERCEL_PROJECT_ID      — Vercel project ID for this environment

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy → ${{ github.ref_name }}
    runs-on: ubuntu-latest

    # Resolves to "dev" or "production" based on the branch
    environment: ${{ github.ref_name == 'main' && 'production' || 'dev' }}

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      IS_PRODUCTION: ${{ github.ref_name == 'main' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Supabase ──────────────────────────────────────────────────────────────
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Run migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # ── Node / Vercel ─────────────────────────────────────────────────────────
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment info
        run: |
          if [ "$IS_PRODUCTION" = "true" ]; then
            vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
          fi

      - name: Build
        run: |
          if [ "$IS_PRODUCTION" = "true" ]; then
            vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel build --token=${{ secrets.VERCEL_TOKEN }}
          fi

      - name: Deploy
        run: |
          if [ "$IS_PRODUCTION" = "true" ]; then
            vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
          fi
